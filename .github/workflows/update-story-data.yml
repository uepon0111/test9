name: Update story data

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存JSONも再取得する'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 18 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/build_story_data.py'
      - '.github/workflows/update-story-data.yml'

permissions:
  contents: write

concurrency:
  group: story-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "============================================="
          echo " Story data update started"
          echo " Python: $(python3 --version)"
          echo " Runner: $RUNNER_OS / $RUNNER_ARCH"
          echo " Time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "============================================="

      - name: Build story JSON with live progress
        env:
          DOWNLOAD_RETRIES: '2'
          DOWNLOAD_TIMEOUT: '25'
          DOWNLOAD_WORKERS: '12'
          PROGRESS_HEARTBEAT: '10'
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          echo "[1/2] Downloading and parsing story assets..."
          echo "Progress is printed continuously below."
          python3 -u scripts/build_story_data.py

      - name: Upload update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-update-report
          path: data/index.json
          retention-days: 7

      - name: Commit generated data
        if: success()
        run: |
          echo "[2/2] Checking generated files..."
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index.json data/stories
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'data: update story talk data'
          git push
