name: Update SEKAI master data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download master data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          curl -fL --retry 3             "https://sekai-world.github.io/sekai-master-db-diff/events.json"             -o data/events.json

          curl -fL --retry 3             "https://sekai-world.github.io/sekai-master-db-diff/eventStories.json"             -o data/eventStories.json

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json data/eventStories.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update SEKAI master data"
          git push
