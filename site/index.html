<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project SEKAI event story talk viewer">
  <title>Event Story Talk Viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --panel2:#1d222b; --text:#f3f5f7; --muted:#9aa4b2; --border:#2d3440; --accent:#90caf9; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; z-index:10; background:rgba(15,17,21,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
    .bar { max-width:1200px; margin:auto; padding:14px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    h1 { font-size:20px; margin:0; flex:1; }
    select,input,button { font:inherit; color:inherit; background:var(--panel2); border:1px solid var(--border); border-radius:9px; padding:8px 10px; }
    button { cursor:pointer; }
    main { max-width:1200px; margin:auto; padding:18px; }
    .meta { color:var(--muted); font-size:13px; margin:4px 0 16px; }
    .characters { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 18px; }
    .chip { border:1px solid var(--border); background:var(--panel); border-radius:999px; padding:6px 10px; font-size:13px; cursor:pointer; }
    .chip.active { outline:2px solid var(--accent); }
    .talk { display:grid; grid-template-columns:110px 1fr; gap:14px; padding:14px; margin:10px 0; background:var(--panel); border:1px solid var(--border); border-radius:12px; scroll-margin-top:110px; }
    .talk .speaker { font-weight:700; color:var(--accent); }
    .body { white-space:pre-wrap; line-height:1.65; }
    .index { color:var(--muted); font-size:12px; margin-top:4px; }
    .voice { margin-top:8px; color:var(--muted); font-size:12px; }
    .empty { padding:40px 10px; color:var(--muted); text-align:center; }
    .tools { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    @media(max-width:640px){ .talk{grid-template-columns:1fr; gap:6px;} }
  </style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Project SEKAI Event Story Talk Viewer</h1>
    <select id="episode" aria-label="Episode"></select>
    <select id="speakerFilter" aria-label="Speaker"><option value="">すべての話者</option></select>
    <input id="search" type="search" placeholder="台詞を検索…">
    <button id="copyLink">現在の位置をコピー</button>
  </div>
</header>
<main>
  <div id="meta" class="meta"></div>
  <div id="characters" class="characters"></div>
  <div class="tools">
    <button id="expandAll">全文表示</button>
    <button id="top">先頭へ</button>
  </div>
  <section id="talks"></section>
</main>
<script>
const state = { index:null, episode:null, speaker:"", query:"" };
const $ = id => document.getElementById(id);

function esc(s){ return String(s ?? "").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function basePath(){ return location.pathname.endsWith('/') ? location.pathname : location.pathname + '/'; }

async function loadIndex(){
  state.index = await fetch(basePath()+"data/index.json").then(r=>r.json());
  const sel = $("episode");
  state.index.episodes.forEach((e,i)=>{
    const o=document.createElement("option"); o.value=e.dataFile; o.textContent=`${i+1}. ${e.scenarioId} (${e.talkCount})`; sel.appendChild(o);
  });
  sel.addEventListener("change",()=>loadEpisode(sel.value));
  if(state.index.episodes.length) await loadEpisode(state.index.episodes[0].dataFile);
}

async function loadEpisode(file){
  state.episode = await fetch(basePath()+"data/"+encodeURIComponent(file)).then(r=>r.json());
  const speakers=[...new Set(state.episode.talks.map(t=>t.speaker))];
  const sf=$("speakerFilter"); sf.innerHTML='<option value="">すべての話者</option>';
  speakers.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;sf.appendChild(o);});
  sf.value=state.speaker="";
  render();
  history.replaceState(null,"","#t1");
}

function render(){
  if(!state.episode) return;
  const t=state.episode.talks;
  const visible=t.filter(x=>(!state.speaker||x.speaker===state.speaker)&&(!state.query||x.body.toLowerCase().includes(state.query.toLowerCase())||x.speaker.toLowerCase().includes(state.query.toLowerCase())));
  $("meta").textContent=`${state.episode.scenarioId} / ${t.length} talks / ${state.episode.characters.length} characters`;
  $("characters").innerHTML=state.episode.characters.map(c=>`<button class="chip ${state.speaker===c.name?'active':''}" data-s="${esc(c.name)}">${esc(c.name)}</button>`).join("");
  $("characters").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.speaker=b.dataset.s;$("speakerFilter").value=state.speaker;render();});
  $("talks").innerHTML=visible.length?visible.map(x=>`<article class="talk" id="t${x.index}"><div><div class="speaker">${esc(x.speaker)}</div><div class="index">#${x.index}</div></div><div><div class="body">${esc(x.body)}</div>${x.voices?.length?`<div class="voice">Voice: ${x.voices.map(v=>esc(v.voiceId||'')).filter(Boolean).join(', ')}</div>`:''}</div></article>`).join(""):'<div class="empty">該当するトークがありません。</div>';
}

$("speakerFilter").addEventListener("change",e=>{state.speaker=e.target.value;render();});
$("search").addEventListener("input",e=>{state.query=e.target.value;render();});
$("copyLink").onclick=async()=>{await navigator.clipboard.writeText(location.href);$("copyLink").textContent="コピーしました";setTimeout(()=>$("copyLink").textContent="現在の位置をコピー",1200);};
$("expandAll").onclick=()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
$("top").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#t(\d+)$/);if(m){const el=document.getElementById("t"+m[1]);if(el)el.scrollIntoView({behavior:"smooth"});}});
loadIndex().catch(err=>{ $("talks").innerHTML='<div class="empty">データを読み込めませんでした。GitHub Actions の初回実行を確認してください。</div>'; console.error(err); });
</script>
</body>
</html>
