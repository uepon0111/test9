<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sekai Talk Extractor</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">GitHub Pages / JSON extractor</p>
        <h1>トークデータ抽出ビューア</h1>
        <p class="lead">GitHub Actionsで `.asset` を取得して talk データだけを静的JSONに変換し、このページで閲覧します。</p>
      </div>
      <div class="meta-card">
        <div class="meta-label">データ元</div>
        <div id="sourceUrl" class="mono small">loading...</div>
        <div class="meta-grid">
          <div><span>シナリオ</span><strong id="scenarioId">-</strong></div>
          <div><span>話数</span><strong id="talkCount">-</strong></div>
          <div><span>取得時刻</span><strong id="fetchedAt">-</strong></div>
        </div>
      </div>
    </header>

    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="話者名や本文で検索" />
      <button id="reloadBtn" type="button">再読み込み</button>
      <button id="copyAllBtn" type="button">本文をまとめてコピー</button>
      <button id="downloadBtn" type="button">JSONをダウンロード</button>
    </section>

    <section class="summary" id="summary"></section>
    <section class="list" id="talkList"></section>
  </main>

  <template id="talkTemplate">
    <article class="talk-card">
      <button class="talk-head" type="button">
        <div>
          <span class="talk-index"></span>
          <span class="speaker"></span>
        </div>
        <span class="body-preview"></span>
      </button>
      <div class="talk-body hidden">
        <pre class="body"></pre>
        <div class="details"></div>
        <div class="actions">
          <button type="button" class="copy-line">この本文をコピー</button>
        </div>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
