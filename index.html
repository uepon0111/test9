<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Project SEKAI イベントストーリーのトーク内容・登場キャラクター閲覧ツール">
  <title>Project SEKAI ストーリートークビューア</title>
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">SK</div>
          <div>
            <h1>ストーリートークビューア</h1>
            <p>Project SEKAI Event Story</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="refreshDataBtn" class="icon-btn" type="button" title="データを再読み込み" aria-label="データを再読み込み">
            <span class="icon icon-refresh" aria-hidden="true"></span>
          </button>
          <button id="copyVisibleBtn" class="icon-btn" type="button" title="表示中の会話をコピー" aria-label="表示中の会話をコピー">
            <span class="icon icon-copy" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <main class="main-layout">
      <aside class="sidebar" aria-label="ストーリー選択">
        <div class="sidebar-section">
          <label for="eventSearch">イベント検索</label>
          <div class="search-box">
            <span class="icon icon-search" aria-hidden="true"></span>
            <input id="eventSearch" type="search" placeholder="イベント名・ID" autocomplete="off">
          </div>
        </div>
        <div id="eventList" class="event-list" aria-live="polite"></div>
      </aside>

      <section class="content-area">
        <div id="loadingState" class="state-card">
          <div class="spinner" aria-hidden="true"></div>
          <h2>ストーリーデータを読み込んでいます</h2>
          <p>生成済みのJSONを読み込んでいます。</p>
        </div>

        <div id="errorState" class="state-card hidden" role="alert">
          <div class="state-icon error" aria-hidden="true">!</div>
          <h2>データを読み込めませんでした</h2>
          <p id="errorMessage"></p>
          <button id="retryBtn" class="primary-btn" type="button">再試行</button>
        </div>

        <div id="reader" class="hidden">
          <section class="story-header">
            <div class="story-heading">
              <div class="eyebrow" id="storyEventId">EVENT</div>
              <h2 id="storyTitle">—</h2>
              <p id="storyOutline"></p>
            </div>
            <div class="story-meta" id="storyMeta"></div>
          </section>

          <nav class="episode-strip" aria-label="エピソード">
            <div id="episodeList" class="episode-list"></div>
          </nav>

          <section class="toolbar">
            <div class="toolbar-left">
              <label class="toolbar-field">
                <span>会話検索</span>
                <div class="search-box compact">
                  <span class="icon icon-search" aria-hidden="true"></span>
                  <input id="talkSearch" type="search" placeholder="台詞・話者を検索" autocomplete="off">
                </div>
              </label>
              <label class="toolbar-field">
                <span>話者</span>
                <select id="speakerFilter">
                  <option value="">すべて</option>
                </select>
              </label>
            </div>
            <div class="toolbar-right">
              <span id="talkCount" class="count-label">0 件</span>
              <button id="downloadTxtBtn" class="secondary-btn" type="button">
                <span class="icon icon-download" aria-hidden="true"></span>
                TXT保存
              </button>
            </div>
          </section>

          <section id="dialogueList" class="dialogue-list" aria-live="polite"></section>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="./assets/app.js" defer></script>
</body>
</html>
